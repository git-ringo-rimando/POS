<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamuning Branch</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { background: #f9fafb; }
    .branch-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      padding: 32px 16px;
      text-align: center;
    }
    .branch-logo-wrap {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(79,70,229,.25);
    }
    .branch-name {
      font-size: 28px;
      font-weight: 800;
      color: #111827;
      line-height: 1.2;
    }
    .branch-sub {
      font-size: 15px;
      color: #9ca3af;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="branch-page">
    <div class="branch-logo-wrap" id="branchLogo">🛒</div>
    <div>
      <div class="branch-name" id="branchName">Kamuning Branch</div>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    loadAppSettings().then(s => {
      const name = s.business_name || 'Kamuning Branch';
      document.title = name;
      document.getElementById('branchName').textContent = name;
      applyLogoToEl(document.getElementById('branchLogo'), s, 'width:100%;height:100%;object-fit:contain;border-radius:24px');
    });
  </script>
</body>
</html>
