<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Terminal</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="pos-layout">
  <!-- Header -->
  <header class="pos-header">
    <div class="pos-header-logo">
      <span>🛒</span> POS Terminal
    </div>
    <div class="pos-header-right">
      <div class="pos-cashier">Cashier: <strong id="cashierName"></strong></div>
      <div class="pos-time" id="posTime"></div>
      <button class="btn btn-sm btn-secondary" id="stockBtn" title="Add Stock">📦 Stock In</button>
      <a href="/admin.html" id="adminLink" class="btn btn-sm btn-outline hidden" style="color:white;border-color:rgba(255,255,255,0.4)">⬅ Dashboard</a>
      <button class="btn btn-sm" id="logoutBtn" style="background:rgba(239,68,68,0.2);color:#fca5a5;border:1.5px solid rgba(239,68,68,0.4)">Logout</button>
    </div>
  </header>

  <div class="pos-body">
    <!-- Products Panel -->
    <div class="products-panel">
      <div class="products-search">
        <input class="form-control" id="productSearch" type="text" placeholder="🔍  Search products..." />
        <button class="btn btn-secondary" id="refreshBtn" title="Refresh products">↺</button>
      </div>
      <div class="category-tabs" id="categoryTabs">
        <button class="cat-tab active" data-cat="all">All</button>
      </div>
      <div class="products-grid" id="productsGrid">
        <div style="display:flex;align-items:center;justify-content:center;height:200px;width:100%;color:#9ca3af;font-size:14px">Loading products…</div>
      </div>
    </div>

    <!-- Cart Panel -->
    <div class="cart-panel">
      <div class="cart-header">
        <div class="flex items-center gap-2">
          <span class="cart-header-title">Current Order</span>
          <span class="cart-header-count" id="cartCount">0</span>
        </div>
        <button class="btn-clear-cart" id="clearCartBtn" title="Clear cart">🗑</button>
      </div>
      <div class="cart-items" id="cartItems">
        <div class="cart-empty">
          <div class="cart-empty-icon">🛒</div>
          <div>Cart is empty</div>
          <div class="text-sm">Click a product to add</div>
        </div>
      </div>
      <div class="cart-footer">
        <div class="cart-discount">
          <label for="discountInput">Discount:</label>
          <input class="form-control" id="discountInput" type="number" min="0" placeholder="₱ 0.00" step="0.01" />
        </div>
        <div class="cart-totals">
          <div class="total-row"><span>Subtotal</span><span id="subtotalDisplay">₱0.00</span></div>
          <div class="total-row"><span>Discount</span><span id="discountDisplay">-₱0.00</span></div>
          <div class="total-row final"><span>TOTAL</span><span class="amount" id="totalDisplay">₱0.00</span></div>
        </div>
        <div class="cart-actions">
          <button class="btn-checkout" id="checkoutBtn" disabled>
            ✓ Checkout
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay hidden" id="paymentModal">
  <div class="modal modal-md">
    <div class="modal-header">
      <h3 class="modal-title">Payment</h3>
      <button class="btn-close" id="closePayment">✕</button>
    </div>
    <div class="modal-body">
      <div class="payment-summary" id="paymentSummary"></div>
      <div class="form-group">
        <label class="form-label">Payment Method</label>
        <div class="payment-method-grid">
          <button class="payment-method-btn selected" data-method="cash">
            <span class="pm-icon">💵</span><span class="pm-label">Cash</span>
          </button>
          <button class="payment-method-btn" data-method="card">
            <span class="pm-icon">💳</span><span class="pm-label">Card</span>
          </button>
          <button class="payment-method-btn" data-method="gcash">
            <span class="pm-icon">📱</span><span class="pm-label">GCash</span>
          </button>
        </div>
      </div>
      <div id="cashSection">
        <div class="form-group">
          <label class="form-label">Amount Received</label>
          <input class="form-control" id="amountPaid" type="number" min="0" step="0.01" placeholder="0.00" style="font-size:20px;font-weight:700;text-align:right" />
        </div>
        <div class="change-display hidden" id="changeDisplay">
          <div class="change-label">CHANGE</div>
          <div class="change-amount" id="changeAmount">₱0.00</div>
        </div>
      </div>
      <div class="form-group mt-4">
        <label class="form-label">Notes (optional)</label>
        <input class="form-control" id="orderNotes" type="text" placeholder="Customer name, table number, etc." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelPayment">Cancel</button>
      <button class="btn btn-success btn-lg" id="processPayment">✓ Complete Sale</button>
    </div>
  </div>
</div>

<!-- Receipt Modal -->
<div class="modal-overlay hidden" id="receiptModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">Receipt</h3>
      <button class="btn-close" id="closeReceipt">✕</button>
    </div>
    <div class="modal-body" id="receiptBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="newOrderBtn">New Order</button>
      <button class="btn btn-primary" id="printReceiptBtn">🖨 Print</button>
    </div>
  </div>
</div>

<!-- Stock In Modal -->
<div class="modal-overlay hidden" id="stockModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3 class="modal-title">📦 Add Stock</h3>
      <button class="btn-close" id="closeStock">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Product</label>
        <select class="form-select" id="stockProduct"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Quantity to Add</label>
        <input class="form-control" id="stockQty" type="number" min="1" placeholder="0" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <input class="form-control" id="stockNotes" type="text" placeholder="Delivery, purchase order, etc." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelStock">Cancel</button>
      <button class="btn btn-primary" id="confirmStock">Add Stock</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/pos.js"></script>
</body>
</html>
