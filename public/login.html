<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon" id="loginLogo">🛒</div>
        <h1 id="loginBrandName">POS System</h1>
        <p>Point of Sale Management</p>
      </div>
      <div id="loginError" class="login-error hidden"></div>
      <form class="login-form" id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">Sign In</button>
      </form>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script>
    loadAppSettings().then(s => {
      const name = s.business_name || 'POS System';
      document.title = name + ' — Login';
      document.getElementById('loginBrandName').textContent = name;
      applyLogoToEl(document.getElementById('loginLogo'), s, 'max-height:80px;width:auto');
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const data = await api.post('/auth/login', {
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        });
        saveSession(data.token, data.user);
        window.location.href = ['admin', 'account_manager'].includes(data.user.role) ? '/sales/pos/admin.html' : '/pos.html';
      } catch (err) {
        errEl.textContent = err.message || 'Login failed';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
